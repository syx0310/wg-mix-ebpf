name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm gcc linux-libc-dev libbpf-dev

      - name: Unit tests
        run: make test-unit

      - name: Static checks
        run: make test-lint

      - name: Race tests
        run: CGO_ENABLED=1 make test-unit-race

      - name: Build Linux amd64 package binary
        run: |
          make build-linux-amd64
          ./bin/wg-mix-ebpf-linux-amd64 version --json >/tmp/wg-mix-ebpf-version.json
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          identity = json.loads(Path("/tmp/wg-mix-ebpf-version.json").read_text())
          head = subprocess.check_output(
              ["/usr/bin/git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          embedded = hashlib.sha256(
              Path("internal/dataplane/embedded/wg_mix_tc.o").read_bytes()
          ).hexdigest()
          if identity["source_commit"] != head:
              raise SystemExit(f"source commit {identity['source_commit']} != {head}")
          if identity["embedded_bpf_object_sha256"] != embedded:
              raise SystemExit("embedded BPF object SHA-256 mismatch")
          if not re.fullmatch(r"[0-9a-f]{64}", embedded):
              raise SystemExit(f"invalid BPF SHA-256 {embedded}")
          PY

      - name: Build Linux arm64 package binary
        run: make build-linux-arm64

      - name: Offline config validation
        run: |
          ./bin/wg-mix-ebpf-linux-amd64 validate --config configs/example.yaml --offline
          ./bin/wg-mix-ebpf-linux-amd64 dump-abi --config configs/example.yaml --offline >/tmp/wg-mix-ebpf-abi.json

      - name: Package artifact
        run: |
          mkdir -p dist/wg-mix-ebpf_linux_amd64
          cp bin/wg-mix-ebpf-linux-amd64 dist/wg-mix-ebpf_linux_amd64/wg-mix-ebpf
          cp README.md dist/wg-mix-ebpf_linux_amd64/
          cp -R configs dist/wg-mix-ebpf_linux_amd64/
          tar -C dist -czf dist/wg-mix-ebpf_linux_amd64.tar.gz wg-mix-ebpf_linux_amd64
          sha256sum dist/wg-mix-ebpf_linux_amd64.tar.gz > dist/checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: wg-mix-ebpf_linux_amd64
          path: |
            dist/wg-mix-ebpf_linux_amd64.tar.gz
            dist/checksums.txt
